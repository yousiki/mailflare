name: Deploy Mailflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      purge_existing:
        description: "Delete only the existing Mailflare resources before deploying"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mailflare-production
  cancel-in-progress: false

env:
  MAILFLARE_STAGE: production

jobs:
  verify:
    name: Verify modern application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --cwd apps/mailflare typecheck

      - name: Lint
        run: bun run --cwd apps/mailflare lint

      - name: Format check
        run: bun run --cwd apps/mailflare format:check

      - name: Unit tests
        run: bun run --cwd apps/mailflare test

      - name: Build TanStack Start Worker
        run: bun run --cwd apps/mailflare build

  deploy:
    name: Deploy production infrastructure
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN: ${{ secrets.CF_TOKEN }}
      CF_AID: ${{ secrets.CF_AID }}
      D1_BACKUP_TOKEN: ${{ secrets.D1_BACKUP_TOKEN }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      GITHUB_UPDATE_TOKEN: ${{ secrets.GITHUB_UPDATE_TOKEN }}
      GITHUB_UPDATE_REF: ${{ vars.GITHUB_UPDATE_REF }}
      GITHUB_UPDATE_REPO: ${{ vars.GITHUB_UPDATE_REPO }}
      MAILFLARE_DOMAIN: ${{ vars.MAILFLARE_DOMAIN }}
      CF_EMAIL_WORKER_NAME: ${{ vars.CF_EMAIL_WORKER_NAME || 'mailflare' }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      ALCHEMY_STAGE: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CF_TOKEN MAILFLARE_DOMAIN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub production environment value or secret: $name"
              exit 1
            fi
          done
          if [[ "${CF_EMAIL_WORKER_NAME:-mailflare}" != "mailflare" ]]; then
            echo "::error::CF_EMAIL_WORKER_NAME must be mailflare"
            exit 1
          fi

      - name: Build TanStack Start Worker
        run: bun run --cwd apps/mailflare build

      - name: Remove existing Mailflare resources when explicitly requested
        if: ${{ inputs.purge_existing == true }}
        env:
          PURGE_CONFIRMATION: ${{ inputs.purge_existing }}
        run: |
          set -euo pipefail
          [[ "$PURGE_CONFIRMATION" == "true" ]]
          echo "Purging only exact Mailflare resource names: worker mailflare, database mailflare, bucket mailflare-raw, queues mailflare-inbound/mailflare-outbound."
          for queue in mailflare-inbound mailflare-outbound; do
            bunx wrangler queues consumer remove "$queue" mailflare || true
          done
          worker_status="$(curl --silent --show-error --output "$RUNNER_TEMP/mailflare-worker-delete.json" --write-out "%{http_code}" --request DELETE \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/mailflare")"
          if [[ "$worker_status" != "200" && "$worker_status" != "404" ]]; then
            cat "$RUNNER_TEMP/mailflare-worker-delete.json"
            exit 1
          fi

          d1_list="$(curl --fail --silent --show-error --request GET \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database")"
          d1_id="$(jq -r '.result[] | select(.name == "mailflare") | (.uuid // .database_id) // empty' <<< "$d1_list" | sed -n '1p')"
          if [[ -n "$d1_id" ]]; then
            d1_delete="$(curl --fail --silent --show-error --request DELETE \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${d1_id}")"
            jq -e '.success == true' <<< "$d1_delete" >/dev/null
          fi

          cleanup_config="$RUNNER_TEMP/mailflare-r2-cleanup-wrangler.jsonc"
          printf '%s\n' '{"name":"mailflare-r2-cleanup","main":"scripts/r2-empty-worker.ts","compatibility_date":"2026-05-20","r2_buckets":[{"binding":"BUCKET","bucket_name":"mailflare-raw","remote":true}]}' > "$cleanup_config"
          cleanup_pid=""
          cleanup_log="$RUNNER_TEMP/mailflare-r2-empty.log"
          cleanup_config_path="$cleanup_config"
          if bunx wrangler r2 bucket info mailflare-raw --config="$cleanup_config_path" --json >/dev/null 2>&1; then
            bunx wrangler dev --remote --config="$cleanup_config_path" --port 8787 --show-interactive-dev-session=false > "$cleanup_log" 2>&1 &
            cleanup_pid=$!
            cleanup_ready=false
            for _ in {1..30}; do
              if curl --silent --fail --max-time 2 http://127.0.0.1:8787/health >/dev/null 2>&1; then
                cleanup_ready=true
                break
              fi
              sleep 1
            done
            if [[ "$cleanup_ready" != "true" ]]; then
              cat "$cleanup_log"
              kill "$cleanup_pid" 2>/dev/null || true
              wait "$cleanup_pid" 2>/dev/null || true
              exit 1
            fi
          fi
          bunx wrangler r2 bucket delete mailflare-raw --config="$cleanup_config_path" || true
          bunx wrangler queues delete mailflare-inbound --config="$cleanup_config_path" || true
          bunx wrangler queues delete mailflare-outbound --config="$cleanup_config_path" || true


      - name: Deploy Alchemy infrastructure
        run: bunx alchemy deploy infra/alchemy.run.ts --stage production --yes --adopt

      - name: Verify public Mailflare pages
        run: |
          set -euo pipefail
          base="https://${MAILFLARE_DOMAIN}"
          for path in / /login /register /setup /inbox /settings /admin; do
            body="$(curl --fail --silent --show-error --location --max-time 30 "$base$path")"
            [[ "$body" == *"Mailflare"* ]] || { echo "::error::Missing Mailflare marker at $path"; exit 1; }
          done
