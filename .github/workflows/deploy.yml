name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailflare-production
  cancel-in-progress: false

env: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAILFLARE_DOMAIN: ${{ vars.MAILFLARE_DOMAIN }}
      CF_EMAIL_WORKER_NAME: ${{ vars.CF_EMAIL_WORKER_NAME || 'mailflare' }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate deployment configuration
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN MAILFLARE_DOMAIN \
            CF_TOKEN CF_EMAIL_WORKER_NAME
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub environment value or secret: $name"
              missing=1
            fi
          done
          if [[ "$CF_EMAIL_WORKER_NAME" != "mailflare" ]]; then
            echo "::error::CF_EMAIL_WORKER_NAME must be mailflare"
            missing=1
          fi
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      # OpenNext uses the authenticated Wrangler session for the remote EMAIL
      # binding during the Next.js build.
      - name: Build OpenNext Worker
        run: npx opennextjs-cloudflare build
      - name: Resolve or create Mailflare D1 database
        id: d1
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${D1_DATABASE_ID:-}" ]]; then
            D1_DATABASE_ID="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "mailflare") | (.uuid // .id)' | sed -n '1p')"
          fi
          if [[ -z "${D1_DATABASE_ID:-}" || "$D1_DATABASE_ID" == "null" ]]; then
            output="$(npx wrangler d1 create mailflare --update-config=false 2>&1)" || { printf '%s\n' "$output"; exit 1; }
            printf '%s\n' "$output"
            D1_DATABASE_ID="$(printf '%s\n' "$output" | sed -n 's/.*"database_id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | sed -n '1p')"
          fi
          if [[ -z "${D1_DATABASE_ID:-}" || "$D1_DATABASE_ID" == "null" ]]; then
            echo "::error::Could not resolve the mailflare D1 database ID."
            exit 1
          fi
          echo "database_id=$D1_DATABASE_ID" >> "$GITHUB_OUTPUT"

      - name: Create production Wrangler configuration
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          cp wrangler.jsonc "$RUNNER_TEMP/wrangler.prod.jsonc"
          python3 -c 'from pathlib import Path; import os; p=Path(os.environ["RUNNER_TEMP"])/"wrangler.prod.jsonc"; s=p.read_text(); needle="\"database_name\": \"mailflare\","; replacement=needle+"\\n\\t\\t\\t\"database_id\": \""+os.environ["D1_DATABASE_ID"]+"\","; assert s.count(needle)==1; p.write_text(s.replace(needle,replacement))'

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config="$RUNNER_TEMP/wrangler.prod.jsonc"

      - name: Create runtime Worker secrets file
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_AID: ${{ secrets.CF_AID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || steps.d1.outputs.database_id }}
          D1_BACKUP_TOKEN: ${{ secrets.D1_BACKUP_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          GITHUB_UPDATE_TOKEN: ${{ secrets.GITHUB_UPDATE_TOKEN }}
          GITHUB_UPDATE_REF: ${{ vars.GITHUB_UPDATE_REF }}
          GITHUB_UPDATE_REPO: ${{ vars.GITHUB_UPDATE_REPO }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          set -euo pipefail
          jq -n '{
            CF_TOKEN: env.CF_TOKEN,
            CF_AID: env.CF_AID,
            D1_DATABASE_ID: env.D1_DATABASE_ID,
            D1_BACKUP_TOKEN: env.D1_BACKUP_TOKEN,
            TURNSTILE_SECRET_KEY: env.TURNSTILE_SECRET_KEY,
            GITHUB_UPDATE_TOKEN: env.GITHUB_UPDATE_TOKEN,
            GITHUB_UPDATE_REF: env.GITHUB_UPDATE_REF,
            GITHUB_UPDATE_REPO: env.GITHUB_UPDATE_REPO,
            CF_EMAIL: env.CF_EMAIL,
            CF_API_KEY: env.CF_API_KEY
          } | with_entries(select(.value != null and .value != ""))' > "$RUNNER_TEMP/mailflare-secrets.json"
          chmod 600 "$RUNNER_TEMP/mailflare-secrets.json"

      - name: Deploy Worker and custom domain
        run: >-
          OPEN_NEXT_DEPLOY=true npx wrangler deploy
          --config="$RUNNER_TEMP/wrangler.prod.jsonc"
          --domain="$MAILFLARE_DOMAIN"
          --var="CF_EMAIL_WORKER_NAME:$CF_EMAIL_WORKER_NAME"
          --secrets-file="$RUNNER_TEMP/mailflare-secrets.json"
          --message="GitHub commit $GITHUB_SHA"

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/mailflare-secrets.json" wrangler.prod.jsonc
